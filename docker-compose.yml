services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:1.7b
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_started
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    command: ["serve"]
volumes:
  ollama-data:
