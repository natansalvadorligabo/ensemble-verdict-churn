[project]
name = "ensemble-verdict-churn"
version = "0.1.0"
description = "Local churn ensemble with LLM arbitration"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "joblib>=1.4,<2.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
training = [
  "kagglehub>=0.3,<1.0",
  "openpyxl>=3.1,<4.0",
  "pycaret>=3.3,<4.0",
]
ui = [
  "chainlit>=2.0,<3.0",
]
test = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
