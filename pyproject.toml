[project]
name = "ensemble-verdict-churn"
version = "0.1.0"
description = "Local churn ensemble with LLM arbitration"
authors = [{ name = "Natan Salvador Ligabô" }]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "joblib>=1.6,<2.0",
  "pandas>=3.0,<4.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
training = [
  "imbalanced-learn>=0.14,<1.0",
  "pyarrow>=20,<30",
  "pycaret==4.0.0a8",
  "scikit-learn>=1.9,<2.0",
  "xgboost>=3.0,<4.0",
]
ui = [
  "chainlit>=2.0,<3.0",
]
test = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
