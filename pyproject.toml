[project]
name = "ensemble-verdict-churn"
version = "0.1.0"
description = "Local churn ensemble with LLM arbitration"
requires-python = ">=3.9,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "joblib>=1.2,<1.4",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
training = [
  "kagglehub>=0.3,<1.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.1,<3.0",
  "pyarrow>=15,<20",
  "pycaret==3.3.2",
  "scikit-learn>=1.4,<2.0",
]
ui = [
  "chainlit>=2.0,<3.0",
]
test = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
